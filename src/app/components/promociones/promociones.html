<section class="hero-section d-flex align-items-center justify-content-center text-center text-white">
    <div class="container">
      <h1 class="display-3 fw-bold mb-3 animated-fade-in">Nuestras Promociones</h1>
      <p class="lead animated-slide-up">Haz click y descubre las mejores ofertas </p>
    </div>
  </section>
  
  <div class="container my-5">
    
    <div class="gallery-grid">
      <div *ngFor="let img of images" class="gallery-item" (click)="openLightbox(img)">
        <img [src]="img" loading="lazy" alt="Promoción Fahsi Lounge">
        <div class="overlay">
          <i class="bi bi-arrows-angle-expand"></i>
        </div>
      </div>
    </div>

    <div class="text-center mt-5">
        <a routerLink="/" class="btn btn-outline-light px-5 py-2">Volver al Inicio</a>
    </div>

  </div>

  <!-- Lightbox Overlay -->
  <div class="lightbox" *ngIf="selectedImage" (click)="closeLightbox()">
    <button class="close-btn" (click)="closeLightbox()">
      <i class="bi bi-x-lg"></i>
    </button>
    <img [src]="selectedImage" class="lightbox-img" (click)="$event.stopPropagation()" alt="Full screen promotion">
  </div>
